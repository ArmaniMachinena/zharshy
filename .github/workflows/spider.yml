name: Жаршы — паук
on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch: {}       # ручной запуск кнопкой
permissions:
  contents: write
concurrency: { group: spider, cancel-in-progress: false }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r spider/requirements.txt
      - name: Обход источников
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_ID_INSTANCE: ${{ secrets.GREEN_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
        run: python spider/run.py
      - name: Сохранить базу
        run: |
          git config user.name "zharshy-bot"
          git config user.email "zharshy-bot@users.noreply.github.com"
          git add data/events.json data/sources_status.json
          git diff --cached --quiet || git commit -m "Жаршы: обновление базы $(date -u +%F\ %H:%M)"
          git push
      - name: Выложить базу на публичный сайт (zharshy-web)
        env:
          WEB_TOKEN: ${{ secrets.WEB_TOKEN }}
        run: |
          if [ -z "$WEB_TOKEN" ]; then echo "WEB_TOKEN не задан — пропускаю"; exit 0; fi
          python build.py
          git clone --depth 1 "https://x-access-token:${WEB_TOKEN}@github.com/ArmaniMachinena/zharshy-web.git" web
          mkdir -p web/data
          cp data/events.json web/data/events.json
          cp data/sources_status.json web/data/sources_status.json
          cp dist/index.html web/index.html
          cd web
          git config user.name "zharshy-bot"
          git config user.email "zharshy-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Обновление базы $(date -u +%F\ %H:%M)"
          git push
