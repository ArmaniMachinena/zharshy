name: Жаршы — паук
on:
  schedule:
    - cron: "17 * * * *"     # каждый час: Telegram и заявки; в 00, 03, 06… UTC — все источники
  workflow_dispatch: {}       # ручной запуск кнопкой
permissions:
  contents: write
concurrency: { group: spider, cancel-in-progress: false }
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r spider/requirements.txt
      - name: Режим прохода
        run: |
          H=$(date -u +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $((H % 3)) -eq 0 ]; then echo "ZHARSHY_MODE=full" >> $GITHUB_ENV; else echo "ZHARSHY_MODE=fast" >> $GITHUB_ENV; fi
      - name: Обход источников
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GREEN_API_URL: ${{ secrets.GREEN_API_URL }}
          GREEN_ID_INSTANCE: ${{ secrets.GREEN_ID_INSTANCE }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
        run: python spider/run.py
      - name: Модерация заявок пользователей
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUBMISSIONS_CSV: ${{ secrets.SUBMISSIONS_CSV }}
        run: python spider/moderate.py
      - name: Пресса о событиях
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python spider/press.py || echo "пресса - ошибка, пропускаю"
      - name: Дозаполнение карточек и отели рядом (раз в 3 часа)
        if: env.ZHARSHY_MODE == 'full'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python spider/enrich.py || echo "дозаполнение - ошибка, пропускаю"
          python spider/hotels.py || echo "отели - ошибка, пропускаю"
      - name: Письма организаторам
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OUTREACH_MODE: ${{ secrets.OUTREACH_MODE }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        run: python spider/outreach.py || echo "письма - ошибка, пропускаю"
      - name: Сохранить базу
        run: |
          git config user.name "zharshy-bot"
          git config user.email "zharshy-bot@users.noreply.github.com"
          git add data/events.json data/sources_status.json
          [ -f data/page_cache.json ] && git add data/page_cache.json || true
          [ -f data/outreach.json ] && git add data/outreach.json || true
          [ -f data/moderation.json ] && git add data/moderation.json || true
          git diff --cached --quiet || git commit -m "Жаршы: обновление базы $(date -u +%F\ %H:%M)"
          git push
      - name: Выложить зашифрованный сайт (zharshy-web)
        env:
          WEB_TOKEN: ${{ secrets.WEB_TOKEN }}
          ZHARSHY_WEB_PASSWORD: ${{ secrets.ZHARSHY_WEB_PASSWORD }}
          ZHARSHY_WEB_SALT: ${{ secrets.ZHARSHY_WEB_SALT }}
        run: |
          if [ -z "$WEB_TOKEN" ] || [ -z "$ZHARSHY_WEB_PASSWORD" ] || [ -z "$ZHARSHY_WEB_SALT" ]; then echo "нет WEB_TOKEN / пароля сайта — пропускаю (открытую версию не выкладываем никогда)"; exit 0; fi
          python build.py
          python encrypt_page.py
          git clone --depth 1 "https://x-access-token:${WEB_TOKEN}@github.com/ArmaniMachinena/zharshy-web.git" web
          cp dist/public/index.html web/index.html
          cd web
          git config user.name "zharshy-bot"
          git config user.email "zharshy-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Обновление $(date -u +%F\ %H:%M)"
          git push
